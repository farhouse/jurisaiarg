services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: juris_ai
      POSTGRES_USER: juris_ai
      POSTGRES_PASSWORD: juris_ai_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - juris_ai_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juris_ai -d juris_ai"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    image: juris-ai-web:local
    build:
      context: ../../web
    environment:
      POSTGRES_DB: juris_ai
      POSTGRES_USER: juris_ai
      POSTGRES_PASSWORD: juris_ai_local
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: local-development-only-change-me
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.1.152}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_TRUST_PROXY_HEADERS: "${DJANGO_TRUST_PROXY_HEADERS:-false}"
      DJANGO_SECURE_COOKIES: "${DJANGO_SECURE_COOKIES:-false}"
    volumes:
      - juris_ai_models:/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  init:
    image: juris-ai-crawler:local
    build:
      context: ../..
      dockerfile: tools/infoleg_index/Dockerfile
    command: ["python", "worker.py", "--init"]
    healthcheck:
      disable: true
    environment: &crawler_environment
      POSTGRES_DB: juris_ai
      POSTGRES_USER: juris_ai
      POSTGRES_PASSWORD: juris_ai_local
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  crawler:
    image: juris-ai-crawler:local
    environment: *crawler_environment
    volumes:
      - juris_ai_models:/models
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

volumes:
  juris_ai_pgdata:
  juris_ai_models:
