{% if decision_errors %}<section class="review-errors" data-decision-errors role="alert" tabindex="-1" aria-labelledby="decision-errors-heading"><h3 id="decision-errors-heading">Corregí estos campos para continuar</h3><p>Tu borrador está guardado. Revisá lo siguiente:</p><ul>{% for error in decision_errors %}<li><strong>{{ error.label }}</strong><p>{{ error.message }}</p><a href="{{ error.url }}">Ir a {{ error.label|lower }}</a></li>{% endfor %}</ul></section>{% endif %}
