{% extends "base.html" %}
{% block title %}Ingresar · JurisAI{% endblock %}
{% block content %}
<section class="login-card">
  <p class="eyebrow">Acceso interno</p>
  <h1>Revisión jurídica</h1>
  <p class="muted">Ingresá para validar las relaciones extraídas desde InfoLEG.</p>
  <form method="post" class="stack-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button primary" type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
