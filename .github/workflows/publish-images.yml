name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: web
            dockerfile: web/Dockerfile
          - component: crawler
            context: .
            dockerfile: tools/infoleg_index/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker build --pull -f "$DOCKERFILE" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:${GITHUB_SHA}" --tag "${image}:latest" "$BUILD_CONTEXT"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
          printf '### %s\n\n- `%s:latest`\n- `%s:%s`\n' "$COMPONENT" "$image" "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
